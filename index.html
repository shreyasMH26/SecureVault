<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SecureVault - Users</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="sidebar">

    <h2>🔐 SecureVault</h2>

    <a href="dashboard.html">📊 Dashboard</a>
    <a href="users.html">👥 Users</a>
    <a href="generator.html">🔑 Generator</a>
    <a href="settings.html">⚙️ Settings</a>

    <button onclick="logout()">
        🚪 Logout
    </button>

</div>

<div class="main">

    <h1>User Management</h1>

    <div class="card">

        <h2>Add User</h2>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <button onclick="addUser()">
            ➕ Add User
        </button>

    </div>

    <br>

    <div class="card">

        <input
            type="text"
            id="search"
            placeholder="🔍 Search User"
            onkeyup="renderUsers()"
        >

    </div>

    <br>

    <div class="card">

        <table id="userTable">

            <thead>

                <tr>
                    <th>User</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</div>

<!-- COMMAND PALETTE -->

<div id="commandPalette" class="command-palette">

    <div class="palette-box">

        <input
            type="text"
            placeholder="Search Commands..."
        >

        <button onclick="navigatePage('dashboard.html')">
            📊 Dashboard
        </button>

        <button onclick="navigatePage('users.html')">
            👥 Users
        </button>

        <button onclick="navigatePage('generator.html')">
            🔑 Generator
        </button>

        <button onclick="navigatePage('settings.html')">
            ⚙️ Settings
        </button>

        <button onclick="logout()">
            🚪 Logout
        </button>

        <button onclick="closePalette()">
            ❌ Close
        </button>

    </div>

</div>

<script src="app.js"></script>
<div class="card">

<input
type="text"
id="website"
placeholder="Website/App Name"
>

<button onclick="savePassword()">
💾 Save Password
</button>
<div class="card">

<h2>Saved Passwords</h2>

<div id="passwordList">

</div>

</div>
</div>
</body>
</html>
